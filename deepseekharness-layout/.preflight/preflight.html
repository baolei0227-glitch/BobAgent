<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* DeepSeek Harness — Desktop App Shell Tokens */

:root {
  /* Primary hue: DeepSeek cyan-blue */
  --dh-brand-50: #ecfdff;
  --dh-brand-100: #cff7fe;
  --dh-brand-200: #a0edfd;
  --dh-brand-300: #60dafa;
  --dh-brand-400: #1cbbf2;
  --dh-brand-500: #00a0d2;
  --dh-brand-600: #0080af;
  --dh-brand-700: #00678d;
  --dh-brand-800: #005274;
  --dh-brand-900: #06455f;

  /* Neutral surface scale */
  --dh-neutral-0: #ffffff;
  --dh-neutral-50: #f8f9fb;
  --dh-neutral-100: #f1f3f6;
  --dh-neutral-200: #e3e7ec;
  --dh-neutral-300: #c9d0d8;
  --dh-neutral-400: #9aa5b1;
  --dh-neutral-500: #69727d;
  --dh-neutral-600: #4b535c;
  --dh-neutral-700: #3a4047;
  --dh-neutral-800: #24282d;
  --dh-neutral-900: #15181b;

  /* Semantic aliases */
  --dh-background: var(--dh-neutral-0);
  --dh-foreground: var(--dh-neutral-900);
  --dh-card: var(--dh-neutral-50);
  --dh-card-foreground: var(--dh-neutral-900);
  --dh-popover: var(--dh-neutral-0);
  --dh-popover-foreground: var(--dh-neutral-900);
  --dh-primary: var(--dh-brand-600);
  --dh-primary-foreground: var(--dh-neutral-0);
  --dh-muted: var(--dh-neutral-100);
  --dh-muted-foreground: var(--dh-neutral-500);
  --dh-border: var(--dh-neutral-200);
  --dh-input: var(--dh-neutral-200);
  --dh-ring: var(--dh-brand-500);

  /* State colors */
  --dh-state-success: #16a34a;
  --dh-state-warning: #d97706;
  --dh-state-error: #dc2626;
  --dh-state-info: var(--dh-brand-500);

  /* Radius */
  --dh-radius-xs: 2px;
  --dh-radius-sm: 4px;
  --dh-radius-md: 8px;
  --dh-radius-lg: 16px;
  --dh-radius-pill: 999px;

  /* Shadows */
  --dh-shadow-1: 0 1px 2px rgba(21, 24, 27, 0.05), 0 1px 1px rgba(21, 24, 27, 0.03);
  --dh-shadow-2: 0 8px 24px -8px rgba(21, 24, 27, 0.18);
  --dh-shadow-3: 0 24px 60px -20px rgba(21, 24, 27, 0.30);

  /* Typography */
  --dh-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --dh-font-mono: "SF Mono", SFMono-Regular, ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;

  /* Spacing scale reference */
  --dh-space-1: 4px;
  --dh-space-2: 8px;
  --dh-space-3: 12px;
  --dh-space-4: 16px;
  --dh-space-5: 24px;
  --dh-space-6: 32px;
  --dh-space-7: 48px;
  --dh-space-8: 64px;
}

/* Dark mode overrides */
html.dark {
  --dh-background: #0d0f12;
  --dh-foreground: #f1f3f6;
  --dh-card: #14171b;
  --dh-card-foreground: #f1f3f6;
  --dh-popover: #14171b;
  --dh-popover-foreground: #f1f3f6;
  --dh-muted: #1c2026;
  --dh-muted-foreground: #9aa5b1;
  --dh-border: #2a2f36;
  --dh-input: #2a2f36;
  --dh-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --dh-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --dh-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.60);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--dh-background);
    --color-foreground: var(--dh-foreground);
    --color-card: var(--dh-card);
    --color-card-foreground: var(--dh-card-foreground);
    --color-popover: var(--dh-popover);
    --color-popover-foreground: var(--dh-popover-foreground);
    --color-primary: var(--dh-primary);
    --color-primary-foreground: var(--dh-primary-foreground);
    --color-muted: var(--dh-muted);
    --color-muted-foreground: var(--dh-muted-foreground);
    --color-border: var(--dh-border);
    --color-input: var(--dh-input);
    --color-ring: var(--dh-ring);
    --radius-sm: var(--dh-radius-sm);
    --radius-md: var(--dh-radius-md);
    --radius-lg: var(--dh-radius-lg);
  }
  @layer base {
    body { background: var(--dh-background); color: var(--dh-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .bg-primary-foreground { background-color: var(--dh-primary-foreground); }
      .text-primary-foreground { color: var(--dh-primary-foreground); }
      .border-primary-foreground { border-color: var(--dh-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--dh-primary-foreground); }

      .ring-muted-foreground { --tw-ring-color: var(--dh-muted-foreground); }
      .bg-border { background-color: var(--dh-border); }
      .text-border { color: var(--dh-border); }
      .border-border { border-color: var(--dh-border); }
      .ring-border { --tw-ring-color: var(--dh-border); }
      .bg-input { background-color: var(--dh-input); }
      .text-input { color: var(--dh-input); }
      .border-input { border-color: var(--dh-input); }
      .ring-input { --tw-ring-color: var(--dh-input); }
      .bg-ring { background-color: var(--dh-ring); }

      .ring-ring { --tw-ring-color: var(--dh-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
