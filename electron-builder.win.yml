# electron-builder.win.yml —— Windows 打包配置（测试版）
#
# 为什么不复用 package.json 里的 `build` 段：
#   `build` 段是 mac/Windows 共用的，而测试版需要两处 Windows 专属的取舍
#   （asar 关掉以便逐项断言、extraResources 只取整理后的 standalone）。
#   写在单独文件里，`-c.xxx=false` 这类「字符串变布尔」的 CLI 覆盖就完全不需要了
#   —— electron-builder 对 CLI 传入的 `"false"` 是否会当布尔处理并不保证，
#   一旦被当成真值，asar 会悄悄开着，而断言脚本会因此查不到东西。
#
# 用法：pnpm exec electron-builder --config electron-builder.win.yml --win nsis --x64 --publish never

appId: com.bobwork.app
productName: BobWork

directories:
  output: release

# 主进程是 tsup 的打包产物（electron/dist/main.js），但它里面**仍有外部 require**：
#   require("electron-updater") / require("adm-zip")
# 因为 tsup 默认把 package.json 的 dependencies 视为 external。
# 这些由 electron-builder 按 dependencies 自动收进包，所以这里只列我们自己的产物目录。
files:
  - electron/dist/**/*
  - package.json

# ⚠️ 测试版刻意不打包进 asar：
#   asar 里的内容只能靠二次工具打开，而「装完双击没反应」最常见的根因就是
#   某个运行时依赖没进包。关掉之后 CI 能逐项断言 resources/app 的真实内容，
#   用户排查问题时也能直接看到文件。
asar: false

# ⚠️ 关掉 electron-builder 的自动 rebuild，否则**在 macOS 上交叉打 Windows 包会直接失败**：
#   @electron/rebuild 对 better-sqlite3（带 binding.gyp）会尝试 node-gyp 从源码重编，
#   而 node-gyp 不支持跨平台编译，报错原文：
#     "node-gyp does not support cross-compiling native modules from source."
#   这个 rebuild 本来就不需要：better-sqlite3@13 走 N-API，包内自带 8 个平台的预编译
#   （prebuilds/win32-x64.node），node-gyp-build 在运行期按平台挑，ABI 也是稳定的
#   （实测宿主 node22 = NODE_MODULE_VERSION 127，Electron 43.2.0 = 148，同一份 .node 两边都能 require）。
#   在 Windows runner 上构建时这一步恰好能成功，所以 CI 侧一直没有暴露。
npmRebuild: false

# 只取 stage-standalone.mjs 整理过的产物：
#   - server.js 已被换成自定义入口（含 /remote-login）
#   - 已补 assets/skills 与运行时脚本
# 若直接指 .next/standalone 原样，server.js 会是 Next 的原生 wrapper（工单 W-4）。
#
# ⚠️ `.next/static` 与 `public` **不在** standalone 目录里（Next 只把服务端产物放那儿），
#    必须单独挂进来。漏了它们不会报错，只会表现为「窗口打开一片空白 / JS 全 404」——
#    第二次构建就是漏了这两条，靠「打包内容断言」里的 static chunks 检查才当场发现的。
extraResources:
  - from: .next/standalone
    to: next-standalone
  - from: .next/static
    to: next-standalone/.next/static
  - from: public
    to: next-standalone/public
  # 内置头像：与 mac 侧 build-electron.sh 的 Resources/avatars 布局对齐
  - from: assets/avatars
    to: avatars
  # 随包嵌入式 Python（Windows 无系统 python3）：先跑 scripts/assemble-win-python.mjs
  # 生成 .build/python，再由此挂进 resources/python，运行时由 pythonBin 解析。
  # 注意：走 pack-win.sh 的 --prepackaged 路径时不会执行 extraResources，
  # 那份目录由 assemble-win-resources.mjs 直接写入 resources/python（两处布局一致）。
  - from: .build/python
    to: python

win:
  # 应用与安装器图标。源是 public/icon-512.png（512×512），electron-builder 会自己
  # 转成多尺寸 .ico。不设这一项时，构建日志会打
  #   "default Electron icon is used reason=application icon is not set"
  # 结果就是桌面上是个 Electron 默认图标，辨识度为零。
  # 刻意写在 win 段内而不是 build/icon.png：后者会被 mac 侧一并捡走，影响面更大。
  icon: public/icon-512.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # 这三个是「装完桌面上有没有东西」的直接开关，显式写出来而不是靠默认值：
  # createDesktopShortcut 默认虽然是 true，但便携版（--win dir）根本不执行安装脚本，
  # 用户拿到解压目录会以为"装完了却没图标"。装安装器时这三项才真正生效。
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: BobWork
  # 未签名：Windows SmartScreen 会拦一次（更多信息 → 仍要运行）。
  # 测试版不引入自签证书，避免把「证书装没装」混进「应用能不能跑」的判断里。

# 自动更新通道：必须与 package.json 的 build.publish 指向同一地址。
# 这份独立配置不会继承 package.json 的 build 段 —— 不写 publish 时 electron-builder
# 不会生成 latest.yml，Windows 端的 electron-updater 也就永远发现不了更新
# （mac 侧的 latest-mac.yml 一直是 package.json 那份配置在生成，容易误以为 Windows 也有）。
publish:
  - provider: generic
    url: https://gitcode.com/baolei89/BobWork/releases/download/latest
