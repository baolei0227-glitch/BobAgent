# Windows 冒烟 —— 在**真实 Windows x64** 上验证阶段 C（进程模型）/ 阶段 D（安全边界）
#
# 为什么要这个工作流：`src/lib/platform/**` 的单测全部由**手写的 Windows 输出样例**驱动。
# 手写样例只能证明「解析器符合我的想象」，不能证明「真实 netstat / taskkill / PowerShell
# 在 Windows Server 2025 英文版上的输出与行为就是这样」。真机只有一处能免费拿到：
# GitHub Actions 的 `windows-latest`（runners 是真正的 Windows Server，不是模拟层）。
#
# 三道闸门，语义不同，别混：
#   1. 单测（Windows 样例驱动）—— 解析逻辑，任一失败 = 代码错
#   2. platform-selftest（真机断言）—— 用真实进程自证，任一失败 = 阶段 C/D 是假的
#   3. platform-doctor（环境报告）—— 只报告缺哪些能力，**不阻断**（缺 python/ffmpeg 属正常）
#
# 手动触发：仓库 Actions 页 → Windows Smoke → Run workflow。

name: Windows Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/windows-smoke'
      - 'main'
    paths:
      - 'src/lib/platform/**'
      - 'src/lib/python/**'
      - 'src/lib/shell/**'
      - 'scripts/platform-*.ts'
      - 'scripts/compile-desktop.mjs'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-smoke.yml'

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: windows-latest / node 22
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出
        uses: actions/checkout@v5

      # 不给 version 输入：pnpm/action-setup 会读 package.json 的 packageManager（pnpm@9.0.0）。
      # ⚠️ 千万别同时显式写 version —— 两者不一致时 action-setup 直接报错
      #    "Multiple versions of pnpm specified"，且在 setup 阶段就失败，连 install 都到不了。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 证据先于结论：这一段在任何可能失败的步骤之前，保证「机器长什么样」总有记录
      - name: 环境信息
        shell: pwsh
        run: |
          Write-Host "platform : $(node -p process.platform)"
          Write-Host "arch     : $(node -p process.arch)"
          Write-Host "node     : $(node -v)"
          Write-Host "pnpm     : $(pnpm -v)"
          Write-Host ([System.Environment]::OSVersion.VersionString)
          Write-Host "--- netstat 前 5 行（Windows 进程层的唯一见证）---"
          & "$env:SystemRoot\System32\netstat.exe" -ano -p tcp | Select-Object -First 5

      # 这里原先有一个「造占位包」的步骤，因为 `"unified-renderer": "file:../assets/unified-renderer"`
      # 指向仓库之外的目录，干净检出必然 ERR_PNPM_LINKED_PKG_DIR_NOT_FOUND。
      # 该缺陷已修（依赖改为 file:./packages/unified-renderer，目录已入库），占位包随之删除 ——
      # **保留它会让 CI 假装仓库是自包含的**，这类绕过一旦常驻，W-1 那类缺陷就再也暴露不出来。
      #
      # --ignore-scripts：本工作流不碰 Electron / better-sqlite3 的原生构建，
      # 跳过 postinstall 可省掉 electron 二进制下载（≈100MB）与 node-gyp 编译，
      # 也让「原生模块装不上」不污染信号（那是阶段 A 打包时才需要证明的事）。
      #
      # 不再带 `--no-frozen-lockfile` 兜底：锁文件与 package.json 漂移本身就是缺陷，
      # 要红，不要悄悄重算（重算会把 peer 解析整表刷新，问题被埋掉）。
      #
      # 失败时把真实报错**打进 annotation**：Actions 日志需要 token 才能下载，
      # 而 annotation 匿名可读 —— 否则只能看到「exit code 1」。
      - name: 安装依赖
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content install.log -Tail 40 -Encoding UTF8) -join ' | '
            $tail = $tail.Substring(0, [Math]::Min(3500, $tail.Length))
            Write-Host "::error title=pnpm-install::$tail"
            exit 1
          }
          Write-Host "install OK (frozen-lockfile)"

      # 阶段 A 的前半段：桌面端产物能否在 Windows 上编出来。
      # 这一步的价值不在「tsup 编 JS 与平台无关」，而在**证明整条链路没有 bash 依赖**：
      # 原来的 build-electron.sh / package-release.sh 都是 `npx tsup` / `corepack pnpm tsup`，
      # Windows 上既没有 bash，npx 在 .bin 缺失时还会联网取任意版本让产物静默漂移。
      - name: 编译桌面端产物（主进程 / preload / 自定义 server）
        shell: pwsh
        run: |
          node scripts/compile-desktop.mjs 2>&1 | Tee-Object -FilePath compile.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content compile.log -Tail 30 -Encoding UTF8) -join ' | '
            $tail = $tail.Substring(0, [Math]::Min(3000, $tail.Length))
            Write-Host "::error title=compile-desktop::$tail"
            exit 1
          }

      # 闸门 1：解析器单测（Windows 样例 + 反例）
      - name: 单测 · 平台层与命令守卫
        shell: pwsh
        run: |
          # 双 reporter：verbose 给人看（失败时能定位到断言），json 给机器读（做证据）。
          pnpm exec vitest run src/lib/platform src/lib/shell src/lib/python --reporter=verbose --reporter=json --outputFile.json=vitest.json 2>&1 | Tee-Object -FilePath vitest.log
          if ($LASTEXITCODE -ne 0) {
            $t = (Get-Content vitest.log -Encoding UTF8 | Select-String -Pattern 'FAIL|×|AssertionError|Expected|Received' | Select-Object -First 12) -join ' | '
            Write-Host "::error title=vitest::$($t)"
            exit 1
          }
          # 证据必须从 JSON 取，**不能解析人读输出**。
          # 实测：vitest 即使 stdout 不是 TTY 也照样上色，日志里是
          #   \x1b[2m Test Files \x1b[22m \x1b[1m\x1b[32m4 passed\x1b[39m\x1b[22m
          # 所以任何 `^\s*Test Files\s+\d+` 的行首锚定都必然落空（上一版就是这样把汇总丢掉，
          # 只剩 Duration 行里的 `tests 75ms` 被当成证据 —— 看起来绿，其实什么都没证明）。
          $j = Get-Content vitest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $files = @($j.testResults).Count
          $sum = "files=$files tests=$($j.numTotalTests) passed=$($j.numPassedTests) failed=$($j.numFailedTests)"
          Write-Host "::notice title=vitest-summary::$sum"
          # 金标准下限：断言数缩水时 vitest 依然是绿的（少跑一个文件也是 success）。
          # 下限是最低的护栏，不是覆盖率指标 —— 加测试不用改它，删测试必须扭红。
          if ($files -lt 4 -or $j.numTotalTests -lt 90) {
            Write-Host "::error title=vitest-coverage::断言数低于下限（$sum，期望 files>=4 且 tests>=90）—— 有测试文件没被跑到"
            exit 1
          }

      # 闸门 2：真机断言 —— 本工作流的核心。失败即为真缺陷，必须修代码而不是改断言。
      - name: 真机断言 · 进程层 / 命令守卫
        shell: pwsh
        run: |
          pnpm exec tsx scripts/platform-selftest.ts 2>&1 | Tee-Object -FilePath selftest.log
          if ($LASTEXITCODE -ne 0) {
            # 每条 FAIL 行都要带「为什么不成立」——只报「查询失败」的断言与没有断言等价：
            # 它只会教会人忽略红灯。所以 detail 由 selftest 自己产出（含尝试次数与原始 stderr）。
            $fails = Get-Content selftest.log -Encoding UTF8 | Select-String -Pattern '\[FAIL\]'
            $t = (($fails | Select-Object -First 10) | ForEach-Object { $_.Line.Trim() }) -join ' | '
            if ($t.Length -gt 3500) { $t = $t.Substring(0, 3500) + ' …(截断)' }
            Write-Host "::error title=selftest::$t"
            exit 1
          }

          # 绿了也要留证据：15 项断言全过时，匿名侧现在一条都看不到 ——
          # 包括「父 pid 查询用了几次尝试」这种能提前预警通道抖动的前兆指标。
          $ok = Get-Content selftest.log -Encoding UTF8 | Select-String -Pattern '\[OK  \]'
          $total = @($ok).Count
          $ppid = ($ok | Where-Object { $_.Line -like '*父 pid*' } | ForEach-Object { $_.Line.Trim() }) -join ''
          $brief = if ($ppid.Length -gt 160) { $ppid.Substring(0, 160) } else { $ppid }
          Write-Host "::notice title=selftest-summary::通过 $total 项 / $brief"
          # 断言条数下限：少跑一条也是绿的（循环里 continue 掉就能悄悄少测），必须能扭红
          if ($total -lt 15) {
            Write-Host "::error title=selftest-coverage::断言数 $total 低于下限 15 —— 有断言没被执行"
            exit 1
          }

      # 闸门 3：能力报告。缺 python/ffmpeg 在 runner 上是预期的，所以不阻断，
      # 但结论必须**匿名可读**（Actions 日志要 token 才能下载，annotation 不用）。
      - name: 能力自检（报告，不阻断）
        shell: pwsh
        run: |
          pnpm exec tsx scripts/platform-doctor.ts > doctor.log 2>&1
          $code = $LASTEXITCODE
          $lines = Get-Content doctor.log -Encoding UTF8
          $lines | Write-Host
          Write-Host "doctor exit = $code （1 = 有必需能力缺失，属环境信息，不算失败）"
          $joined = ($lines | Where-Object { $_ -match '结论|缺|OK|warn|FAIL|能力' }) -join ' / '
          if ($joined.Length -gt 3500) { $joined = $joined.Substring(0, 3500) }
          Write-Host "::notice title=doctor::$joined"
          "## platform-doctor (windows-latest)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 0

      - name: 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-smoke-logs
          path: |
            install.log
            compile.log
            vitest.log
            vitest.json
            selftest.log
            doctor.log
          if-no-files-found: ignore
          retention-days: 7
