# Windows 冒烟 —— 在**真实 Windows x64** 上验证阶段 C（进程模型）/ 阶段 D（安全边界）
#
# 为什么要这个工作流：`src/lib/platform/**` 的单测全部由**手写的 Windows 输出样例**驱动。
# 手写样例只能证明「解析器符合我的想象」，不能证明「真实 netstat / taskkill / PowerShell
# 在 Windows Server 2025 英文版上的输出与行为就是这样」。真机只有一处能免费拿到：
# GitHub Actions 的 `windows-latest`（runners 是真正的 Windows Server，不是模拟层）。
#
# 三道闸门，语义不同，别混：
#   1. 单测（Windows 样例驱动）—— 解析逻辑，任一失败 = 代码错
#   2. platform-selftest（真机断言）—— 用真实进程自证，任一失败 = 阶段 C/D 是假的
#   3. platform-doctor（环境报告）—— 只报告缺哪些能力，**不阻断**（缺 python/ffmpeg 属正常）
#
# 手动触发：仓库 Actions 页 → Windows Smoke → Run workflow。

name: Windows Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/windows-smoke'
      - 'main'
    paths:
      - 'src/lib/platform/**'
      - 'src/lib/shell/**'
      - 'scripts/platform-*.ts'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-smoke.yml'

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: windows-latest / node 22
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出
        uses: actions/checkout@v5

      # 不给 version 输入：pnpm/action-setup 会读 package.json 的 packageManager（pnpm@9.0.0）。
      # ⚠️ 千万别同时显式写 version —— 两者不一致时 action-setup 直接报错
      #    "Multiple versions of pnpm specified"，且在 setup 阶段就失败，连 install 都到不了。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 证据先于结论：这一段在任何可能失败的步骤之前，保证「机器长什么样」总有记录
      - name: 环境信息
        shell: pwsh
        run: |
          Write-Host "platform : $(node -p process.platform)"
          Write-Host "arch     : $(node -p process.arch)"
          Write-Host "node     : $(node -v)"
          Write-Host "pnpm     : $(pnpm -v)"
          Write-Host ([System.Environment]::OSVersion.VersionString)
          Write-Host "--- netstat 前 5 行（Windows 进程层的唯一见证）---"
          & "$env:SystemRoot\System32\netstat.exe" -ano -p tcp | Select-Object -First 5

      # 这里原先有一个「造占位包」的步骤，因为 `"unified-renderer": "file:../assets/unified-renderer"`
      # 指向仓库之外的目录，干净检出必然 ERR_PNPM_LINKED_PKG_DIR_NOT_FOUND。
      # 该缺陷已修（依赖改为 file:./packages/unified-renderer，目录已入库），占位包随之删除 ——
      # **保留它会让 CI 假装仓库是自包含的**，这类绕过一旦常驻，W-1 那类缺陷就再也暴露不出来。
      #
      # --ignore-scripts：本工作流不碰 Electron / better-sqlite3 的原生构建，
      # 跳过 postinstall 可省掉 electron 二进制下载（≈100MB）与 node-gyp 编译，
      # 也让「原生模块装不上」不污染信号（那是阶段 A 打包时才需要证明的事）。
      #
      # 不再带 `--no-frozen-lockfile` 兜底：锁文件与 package.json 漂移本身就是缺陷，
      # 要红，不要悄悄重算（重算会把 peer 解析整表刷新，问题被埋掉）。
      #
      # 失败时把真实报错**打进 annotation**：Actions 日志需要 token 才能下载，
      # 而 annotation 匿名可读 —— 否则只能看到「exit code 1」。
      - name: 安装依赖
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content install.log -Tail 40 -Encoding UTF8) -join ' | '
            $tail = $tail.Substring(0, [Math]::Min(3500, $tail.Length))
            Write-Host "::error title=pnpm-install::$tail"
            exit 1
          }
          Write-Host "install OK (frozen-lockfile)"

      # 闸门 1：解析器单测（Windows 样例 + 反例）
      - name: 单测 · 平台层与命令守卫
        shell: pwsh
        run: |
          pnpm exec vitest run src/lib/platform src/lib/shell --reporter=verbose 2>&1 | Tee-Object -FilePath vitest.log
          if ($LASTEXITCODE -ne 0) {
            $t = (Get-Content vitest.log -Encoding UTF8 | Select-String -Pattern 'FAIL|×|AssertionError|Expected|Received' | Select-Object -First 12) -join ' | '
            Write-Host "::error title=vitest::$($t)"
            exit 1
          }

      # 闸门 2：真机断言 —— 本工作流的核心。失败即为真缺陷，必须修代码而不是改断言。
      - name: 真机断言 · 进程层 / 命令守卫
        shell: pwsh
        run: |
          pnpm exec tsx scripts/platform-selftest.ts 2>&1 | Tee-Object -FilePath selftest.log
          if ($LASTEXITCODE -ne 0) {
            $t = (Get-Content selftest.log -Encoding UTF8 | Select-String -Pattern 'FAIL' | Select-Object -First 10) -join ' | '
            Write-Host "::error title=selftest::$($t)"
            exit 1
          }

      # 闸门 3：能力报告。缺 python/ffmpeg 在 runner 上是预期的，所以不阻断，
      # 但结论必须**匿名可读**（Actions 日志要 token 才能下载，annotation 不用）。
      - name: 能力自检（报告，不阻断）
        shell: pwsh
        run: |
          pnpm exec tsx scripts/platform-doctor.ts > doctor.log 2>&1
          $code = $LASTEXITCODE
          $lines = Get-Content doctor.log -Encoding UTF8
          $lines | Write-Host
          Write-Host "doctor exit = $code （1 = 有必需能力缺失，属环境信息，不算失败）"
          $joined = ($lines | Where-Object { $_ -match '结论|缺|OK|warn|FAIL|能力' }) -join ' / '
          if ($joined.Length -gt 3500) { $joined = $joined.Substring(0, 3500) }
          Write-Host "::notice title=doctor::$joined"
          "## platform-doctor (windows-latest)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 0

      - name: 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-smoke-logs
          path: |
            install.log
            vitest.log
            selftest.log
            doctor.log
          if-no-files-found: ignore
          retention-days: 7
