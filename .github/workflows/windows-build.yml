# Windows 测试版安装包 —— 在真实 Windows x64 上构建 NSIS 安装包
#
# 为什么要在这里构建而不是在 mac 上交叉编译：
#   `better-sqlite3` 是原生模块，且 `electron/main.ts` 用 Electron 自带的 Node 运行时
#   （ELECTRON_RUN_AS_NODE）启动 Next 服务 ⇒ 这份 .node 必须按 **Electron + win32-x64** 的
#   ABI 编出来。mac 上做不到（没有 MSVC），拿 wine 糊也只会得到「装完启动即崩」的包。
#   所以构建必须发生在真正的 Windows 上。这里用 windows-latest（真机，不是模拟层）。
#
# 与 windows-smoke.yml 的分工：
#   - windows-smoke  = 断言（进程模型 / 命令守卫 / 单测），快，每次改动都跑
#   - windows-build  = 出货（安装包），慢（next build + 原生编译），只在需要时跑
#
# 手动触发：Actions → Windows Installer → Run workflow
# 或 push 到 ci/win-installer 分支。

name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_to_gitcode:
        description: '构建后上传到 GitCode Release（要求同版本 macOS 已发布）'
        type: boolean
        default: false
  push:
    branches:
      - 'ci/win-installer'

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  build-installer:
    name: windows-latest / nsis x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # ⚠️ 必须带 --ignore-scripts，且**必须**手动补装 Electron 二进制。
      #
      # 为什么不能让它跑脚本：`better-sqlite3` 的 package.json 没有 install 脚本，
      # 但带 `binding.gyp` ⇒ npm/pnpm 的默认行为是跑 `node-gyp rebuild`，而 runner 上是
      # Visual Studio「18」，node-gyp 的版本探测不认识，报
      #   `find VS unknown version "undefined" found at "...\Visual Studio\18\Enterprise"`
      # ⇒ install 阶段直接红（run #1 就是这么挂的）。
      # 而这次编译纯属多余：该包自带 prebuilds/win32-x64.node，且用的是 node-addon-api（N-API），
      # 二进制在 Node 与 Electron 之间通用 —— 详见 scripts/verify-standalone-native.mjs 顶部。
      - name: 安装依赖（--ignore-scripts）
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content install.log -Tail 40 -Encoding UTF8) -join ' | '
            $tail = $tail.Substring(0, [Math]::Min(3500, $tail.Length))
            Write-Host "::error title=pnpm-install::$tail"
            exit 1
          }

      # --ignore-scripts 的代价：electron 的 postinstall（下载 electron.exe）不会执行。
      # 没有它 electron-builder 无法打包，所以这一步不能省，失败必须立刻红。
      - name: 补装 Electron 二进制
        shell: pwsh
        run: |
          node node_modules/electron/install.js 2>&1 | Tee-Object -FilePath electron-install.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content electron-install.log -Tail 25 -Encoding UTF8) -join ' | '
            Write-Host "::error title=electron-install::$tail"
            exit 1
          }
          $exe = 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "::error title=electron-install::安装后仍没有 $exe"
            exit 1
          }
          Write-Host "::notice title=electron::$((Get-Item $exe).VersionInfo.ProductVersion)"

      - name: 编译主进程 / preload / 自定义 server
        shell: pwsh
        run: |
          node scripts/compile-desktop.mjs 2>&1 | Tee-Object -FilePath compile.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content compile.log -Tail 30 -Encoding UTF8) -join ' | '
            Write-Host "::error title=compile-desktop::$tail"
            exit 1
          }

      # 堆给 8192：`next build` 的 TS 阶段是全量类型检查，2048 会在
      # `Running TypeScript ...` 阶段 V8 abort（编译阶段早已 ✓，极易误判成代码问题）。
      # 直接调 node_modules 里的入口，不用 npx（npx 在 .bin 缺失时会联网取任意版本）。
      - name: next build（standalone）
        shell: pwsh
        run: |
          $env:NEXT_DISABLE_TURBOPACK = '1'
          $env:NODE_OPTIONS = '--max-old-space-size=8192'
          node node_modules/next/dist/bin/next build 2>&1 | Tee-Object -FilePath nextbuild.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content nextbuild.log -Tail 40 -Encoding UTF8) -join ' | '
            $tail = $tail.Substring(0, [Math]::Min(3500, $tail.Length))
            Write-Host "::error title=next-build::$tail"
            exit 1
          }

      # 整理 standalone：换自定义 server（W-4）、提升子目录、补 skills 与运行时脚本
      - name: 整理 standalone（含 server.js 覆盖断言）
        shell: pwsh
        run: |
          node scripts/stage-standalone.mjs 2>&1 | Tee-Object -FilePath stage.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content stage.log -Tail 25 -Encoding UTF8) -join ' | '
            Write-Host "::error title=stage-standalone::$tail"
            exit 1
          }
          # 正向证据也要能看见：绿了不等于内容对
          $native = (Get-Content stage.log -Encoding UTF8 | Select-String -Pattern '原生模块') -join ' '
          Write-Host "::notice title=stage::$native"

      # 服务端是跑在 **Electron 自带的 Node** 里的（main.ts 用 ELECTRON_RUN_AS_NODE 启动），
      # 所以原生模块必须能在 Electron 下加载。这里不「重编」（该包是 N-API 预编译，不需要），
      # 而是用 Electron 亲自 require 一遍 —— 判据不依赖任何推断。
      - name: 原生模块在 Electron 下可加载（真机断言）
        shell: pwsh
        run: |
          node scripts/verify-standalone-native.mjs 2>&1 | Tee-Object -FilePath native.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content native.log -Tail 30 -Encoding UTF8) -join ' | '
            $tail = $tail.Substring(0, [Math]::Min(3500, $tail.Length))
            Write-Host "::error title=electron-abi::$tail"
            exit 1
          }
          $ok = (Get-Content native.log -Encoding UTF8 | Select-String -Pattern '✓|没有原生模块') -join ' / '
          Write-Host "::notice title=native-abi::$ok"

      # Windows 没有系统 python3，而 Office 模板填充 / Word 修订 / PDF 文本提取 / 图片裁剪
      # 都经 pythonBin 调 Python 脚本。这里组装嵌入式解释器 + win_amd64 轮子，
      # 产物落在 .build/python，由 electron-builder.win.yml 的 extraResources 挂进
      # resources/python（与 pack-win.sh 的目录布局一致）。
      - name: 组装随包嵌入式 Python
        shell: pwsh
        run: |
          node scripts/assemble-win-python.mjs 2>&1 | Tee-Object -FilePath winpython.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content winpython.log -Tail 25 -Encoding UTF8) -join ' | '
            Write-Host "::error title=winpython::$tail"
            exit 1
          }

      - name: 打包 NSIS 安装包
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules/.bin/electron-builder.cmd)) {
            Write-Host "::error title=electron-builder::node_modules 里没有 electron-builder（依赖没装全）"
            exit 1
          }
          # --publish never：package.json / 本配置里若有 publish，不加这个参数
          # electron-builder 会尝试上传，失败又容易被误读成打包失败。
          # --config 指向 Windows 专属配置（asar:false + 只收整理过的 standalone），
          # 说明见 electron-builder.win.yml 顶部。
          pnpm exec electron-builder --config electron-builder.win.yml --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath builder.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content builder.log -Tail 40 -Encoding UTF8) -join ' | '
            $tail = $tail.Substring(0, [Math]::Min(3500, $tail.Length))
            Write-Host "::error title=electron-builder::$tail"
            exit 1
          }

      # 出货前的内容断言。每一条都对应一个「装了但打不开」的已知死法：
      #   - 缺 server.js 的自定义入口 ⇒ 远程访问/CalDAV 静默失效
      #   - 缺 electron-updater / adm-zip ⇒ 主进程 require 抛错，双击图标直接没反应
      - name: 打包内容断言
        shell: pwsh
        run: |
          $app = 'release/win-unpacked/resources/app'
          $ns  = 'release/win-unpacked/resources/next-standalone'
          $checks = @(
            @{ n = '主进程 main.js';        p = "$app/electron/dist/main.js" },
            @{ n = 'preload.js';            p = "$app/electron/dist/preload.js" },
            @{ n = 'electron-updater';      p = "$app/node_modules/electron-updater/package.json" },
            @{ n = 'adm-zip';               p = "$app/node_modules/adm-zip/package.json" },
            @{ n = 'next server.js';        p = "$ns/server.js" },
            @{ n = 'public（静态资源）';     p = "$ns/public" },
            @{ n = '内置头像';              p = 'release/win-unpacked/resources/avatars' },
            @{ n = '随包 Python 解释器';    p = 'release/win-unpacked/resources/python/python.exe' },
            @{ n = 'python-docx';          p = 'release/win-unpacked/resources/python/Lib/site-packages/docx/__init__.py' },
            @{ n = 'Pillow';               p = 'release/win-unpacked/resources/python/Lib/site-packages/PIL/Image.py' },
            @{ n = 'lxml（win_amd64）';     p = 'release/win-unpacked/resources/python/Lib/site-packages/lxml/etree.cp311-win_amd64.pyd' },
            # 没有它主进程会直接判定 "Auto-updater disabled"：装上能用，但永远收不到更新
            @{ n = '自动更新配置';          p = 'release/win-unpacked/resources/app-update.yml' }
          )
          $bad = @()
          foreach ($c in $checks) {
            if (-not (Test-Path $c.p)) { $bad += $c.n; Write-Host "  [MISSING] $($c.n) -> $($c.p)" }
            else { Write-Host "  [OK] $($c.n)" }
          }
          # 目录存在 ≠ 有内容：`static chunks` 为空时页面会 SSR-only、前端 JS 全 404，
          # 而 Test-Path 依然为真。所以这一条要数文件，不能只判存在。
          $chunks = "$ns/.next/static/chunks"
          if (-not (Test-Path $chunks)) { $bad += 'static chunks（目录不存在）' }
          else {
            $n = @(Get-ChildItem $chunks -Recurse -File).Count
            if ($n -eq 0) { $bad += 'static chunks（目录为空）' } else { Write-Host "  [OK] static chunks（$n 个文件）" }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error title=pack-contents::缺少 $($bad -join ', ') —— 装出去会启动失败或功能静默缺失"
            exit 1
          }
          # server.js 必须是自定义入口（原生 wrapper 里没有 /remote-login）
          if (-not (Select-String -Path "$ns/server.js" -Pattern 'remote-login' -Quiet)) {
            Write-Host "::error title=pack-contents::server.js 不是自定义入口（不含 /remote-login）"
            exit 1
          }
          # 结构齐全 ≠ 能 import：这是唯一能做真机验证的地方（mac 只能做结构断言）。
          # 用随包解释器亲自导入一遍，判据不依赖任何推断。
          $py = 'release/win-unpacked/resources/python/python.exe'
          $out = & $py -c 'import docx, PIL, lxml, pdfplumber, openpyxl, pptx, pypdf; print("py-ok")' 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=pack-contents::随包 Python 无法导入依赖：$out"
            exit 1
          }
          Write-Host "  [OK] 随包 Python 可导入 docx/PIL/lxml/pdfplumber/openpyxl/pptx/pypdf"
          $kb = [Math]::Round((Get-Item "$ns/server.js").Length / 1KB, 1)
          Write-Host "::notice title=pack-contents::13 项齐全 / server.js 含 remote-login（$kb KB） / Python import 通过"

      # 装上能用 ≠ 能更新：拿磁盘上的真实 exe 核对 latest.yml 的版本/大小/sha512，
      # 并确认 app-update.yml 指向 GitCode 的 latest 频道。
      # 这三项任一不对都不会在安装时暴露，只会表现为「检查更新永远没结果」。
      - name: 自动更新清单校验
        shell: pwsh
        run: |
          node scripts/check-win-update-manifest.mjs --dir release 2>&1 | Tee-Object -FilePath update-manifest.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content update-manifest.log -Tail 30 -Encoding UTF8) -join ' | '
            $tail = $tail.Substring(0, [Math]::Min(3500, $tail.Length))
            Write-Host "::error title=update-manifest::$tail"
            exit 1
          }

      - name: 产物清单（匿名可读）
        shell: pwsh
        run: |
          $arts = Get-ChildItem release -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $arts) {
            Write-Host "::error title=artifact::release 下没有 .exe 产物"
            exit 1
          }
          $list = ($arts | ForEach-Object {
            "{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)
          }) -join ' / '
          Write-Host "::notice title=installer::$list"
          $list | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: 上传安装包
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: BobWork-win-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

      # 发布不在本 job 里做：Windows runner 访问 api.gitcode.com 实测会拿到
      # 429 / 404「Release Not Found」，而同一 token 在 Ubuntu runner 与本机均为 200。
      # 发布逻辑见文件末尾的 publish job（产物走 actions/download-artifact 在
      # GitHub 内部传递，不经过公网重下）。
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-build-logs
          path: |
            install.log
            electron-install.log
            compile.log
            nextbuild.log
            stage.log
            native.log
            winpython.log
            builder.log
            update-manifest.log
          if-no-files-found: ignore
          retention-days: 7

  # 发布单独放在 ubuntu-latest：
  #   Windows runner 访问 api.gitcode.com 实测拿到 429 / 404「Release Not Found」，
  #   同一 token 在 Ubuntu runner 与本机均为 200 —— 属 GitCode 对该 IP 段/边缘节点的异常。
  #   产物用 actions/download-artifact 在 GitHub 内部传递，不需要重下公网。
  #
  # 顺序闸门（不可省）：Release 必须已由 macOS 创建。若 Windows 先建 tag，latest
  # 频道里只有 latest.yml、没有 latest-mac.yml，已装 mac 用户检查更新会静默失败。
  publish:
    name: 发布到 GitCode / ubuntu
    needs: build-installer
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_gitcode == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载安装包（GitHub 内部传递）
        uses: actions/download-artifact@v5
        with:
          name: BobWork-win-installer
          path: release

      - name: 产物清单
        run: ls -lh release

      - name: 上传到 GitCode Release
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.gitcode.com/api/v5/repos/baolei89/BobWork"
          TAG="v$(node -p "require('./package.json').version")"
          DL="https://gitcode.com/baolei89/BobWork/releases/download"
          if [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "::error title=gitcode::未配置 GITCODE_TOKEN secret"
            exit 1
          fi

          # 1) 顺序闸门：Release 必须已存在（GitCode 偶发 429/404，带退避重试）
          code=""
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o rel.json -w "%{http_code}" --max-time 60 \
              "$API/releases/tags/$TAG?access_token=$GITCODE_TOKEN") || true
            echo "lookup #$i -> $code"
            [ "$code" = "200" ] && break
            sleep $((i * 20))
          done
          if [ "$code" != "200" ]; then
            echo "::error title=gitcode::查询 Release $TAG 失败（HTTP $code）：$(head -c 800 rel.json)"
            exit 1
          fi
          existing=$(node -e 'const r=require("./rel.json"); for (const a of (r.assets||[])) console.log(a.name)')
          echo "release $TAG 已有资产：$(echo "$existing" | tr '\n' ' ')"

          # 2) 逐个上传；latest.yml 放最后，保证清单出现时安装包已在
          fail=0
          for f in release/*.exe release/*.exe.blockmap release/latest.yml; do
            if [ ! -f "$f" ]; then echo "::error title=gitcode::产物缺失 $f"; fail=1; continue; fi
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -qx "$name"; then echo "  [SKIP] $name"; continue; fi
            uploaded=0
            for i in 1 2 3; do
              info=$(curl -sS --max-time 60 "$API/releases/$TAG/upload_url?access_token=$GITCODE_TOKEN&file_name=$name") || { sleep 5; continue; }
              url=$(printf '%s' "$info" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s); if(!d.url) process.exit(1); console.log(d.url)})') || { echo "  获取上传地址失败 $i/3"; sleep 5; continue; }
              hargs=()
              while IFS= read -r h; do hargs+=(-H "$h"); done < <(printf '%s' "$info" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s); for (const [k,v] of Object.entries(d.headers||{})) console.log(k+": "+v)})')
              up=$(curl -sS -o /tmp/put.out -w "%{http_code}" -X PUT --max-time 900 \
                "${hargs[@]}" --data-binary "@$f" "$url") || up=000
              echo "  PUT $name -> HTTP $up"
              if [ "$up" = "200" ]; then uploaded=1; break; fi
              sleep 10
            done
            if [ "$uploaded" != "1" ]; then echo "::error title=gitcode::上传失败 $name"; fail=1; fi
          done
          [ "$fail" = "0" ] || exit 1

          # 3) 更新清单可访问性（CDN 可能滞后，只警告不失败）
          for y in latest-mac.yml latest.yml; do
            c=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 60 "$DL/latest/$y")
            if [ "$c" = "200" ]; then echo "::notice title=update::$y 可访问"
            else echo "::warning title=update::$y 暂不可访问（HTTP $c），等待 CDN 刷新"; fi
          done
          echo "::notice title=gitcode::Windows $TAG 已发布：$DL/$TAG/"
